<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" role="img"
     aria-label="BZM2 TDM frame as opaque transport stage plus result aggregation path; slot interior deferred">
  <title>BZM2 TDM frame and result path (opaque slot)</title>
  <desc>Frame-level TDM transport and block-level result path from UART reference plus public OSS control packing. Slot interior not exploded. Four labeled gaps. Original diagram from public references.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="980" height="780" fill="#12171c"/>
  <rect x="20" y="20" width="940" height="740" rx="10" fill="#1a2228" stroke="#3a4650" stroke-width="1.5"/>
  <text x="490" y="50" text-anchor="middle" fill="#7a8792" font-family="Orbitron,sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em">BZM2 UART · TDM FRAME + RESULT PATH</text>
  <text x="490" y="70" text-anchor="middle" fill="#2dd4bf" font-family="Ubuntu,sans-serif" font-size="11">Opaque transport stage · slot interior deferred · original diagram from public references</text>

  <!-- Control packing -->
  <rect x="40" y="90" width="440" height="150" rx="6" fill="#151a1f" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="56" y="112" fill="#2dd4bf" font-family="Orbitron,sans-serif" font-size="9" letter-spacing="0.08em">TDM CONTROL PACKING · reg 0x07</text>
  <text x="56" y="136" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="12">(slot_bit_count &lt;&lt; 9) | (slot_count &lt;&lt; 1) | 1</text>
  <text x="56" y="158" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="12">bit 0 = enable · [8:1] = slots/frame · [16:9] = bit-times/slot</text>
  <text x="56" y="180" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">Registers: TDM_CONTROL 0x07 · TDM_DELAY 0x09 · UART_TX 0x0A · GAP 0x2D</text>
  <text x="56" y="202" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">Reference geometry (public OSS): 127 bit-times × 100 slots · delay 1</text>
  <text x="56" y="222" fill="#556069" font-family="Ubuntu,sans-serif" font-size="10">Sources: UART § TDM Overview; johnny9/ESP-Miner-Bonanza bzm_bringup.c / bzm_registers.h</text>

  <!-- Class enables -->
  <rect x="500" y="90" width="440" height="150" rx="6" fill="#151a1f" stroke="#E86A2B" stroke-width="1.2"/>
  <text x="516" y="112" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="9" letter-spacing="0.08em">UART_TX 0x0A · CLASS ENABLES (orthogonal to TDM)</text>
  <text x="516" y="136" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="12">bit3 sensor · bit2 result · bit1 register · bit0 NOOP</text>
  <text x="516" y="158" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="12">Reset 0x7 · stream on 0xF · stream off / cold 0x7</text>
  <text x="516" y="180" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">Classes (2-byte header + payload): RESULT 0x01 · REGISTER 0x03</text>
  <text x="516" y="200" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">TELEMETRY 0x0d · NOOP 0x0f — NOOP shown by length only (gap)</text>
  <text x="516" y="222" fill="#556069" font-family="Ubuntu,sans-serif" font-size="10">UART § TX control register · frame parser public lengths</text>

  <!-- Frame strip: opaque slots -->
  <text x="490" y="270" text-anchor="middle" fill="#7a8792" font-family="Orbitron,sans-serif" font-size="9" letter-spacing="0.1em">ONE TDM FRAME · SLOT = ASIC_ID (opaque interiors)</text>
  <g font-family="JetBrains Mono,monospace" font-size="10">
    <rect x="40" y="284" width="88" height="56" rx="4" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="84" y="308" text-anchor="middle" fill="#2dd4bf">slot 0</text>
    <text x="84" y="326" text-anchor="middle" fill="#7a8792" font-size="9">opaque</text>
    <rect x="136" y="284" width="88" height="56" rx="4" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="180" y="308" text-anchor="middle" fill="#2dd4bf">slot 1</text>
    <text x="180" y="326" text-anchor="middle" fill="#7a8792" font-size="9">opaque</text>
    <rect x="232" y="284" width="100" height="56" rx="4" fill="#252018" stroke="#E86A2B" stroke-width="1.3"/>
    <text x="282" y="308" text-anchor="middle" fill="#E86A2B">slot N</text>
    <text x="282" y="326" text-anchor="middle" fill="#d6dde3" font-size="9">= ASIC_ID</text>
    <text x="352" y="318" fill="#7a8792" font-size="16">…</text>
    <rect x="380" y="284" width="100" height="56" rx="4" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="430" y="308" text-anchor="middle" fill="#2dd4bf">slot 99</text>
    <text x="430" y="326" text-anchor="middle" fill="#7a8792" font-size="9">opaque</text>
    <rect x="500" y="284" width="420" height="56" rx="4" fill="#151a1f" stroke="#3a4650" stroke-width="1.2"/>
    <text x="710" y="308" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="12">TX after programmed TDM delay · host listens per slot</text>
    <text x="710" y="326" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">No intra-slot packing drawn — see gaps below</text>
  </g>

  <!-- Result path blocks -->
  <text x="490" y="372" text-anchor="middle" fill="#7a8792" font-family="Orbitron,sans-serif" font-size="9" letter-spacing="0.1em">RESULT PATH (BLOCK LEVEL)</text>
  <g font-family="Ubuntu,sans-serif" font-size="12">
    <rect x="40" y="388" width="160" height="50" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="120" y="410" text-anchor="middle" fill="#d6dde3">tile result FIFO</text>
    <text x="120" y="428" text-anchor="middle" fill="#7a8792" font-size="11">8-deep / tile</text>
    <line x1="200" y1="413" x2="230" y2="413" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="230" y="388" width="170" height="50" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="315" y="410" text-anchor="middle" fill="#d6dde3">ASIC / notch FIFO</text>
    <text x="315" y="428" text-anchor="middle" fill="#7a8792" font-size="11">16-deep</text>
    <line x1="400" y1="413" x2="430" y2="413" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="430" y="388" width="200" height="50" rx="6" fill="#252018" stroke="#E86A2B" stroke-width="1.4"/>
    <text x="530" y="410" text-anchor="middle" fill="#E86A2B">TDM TX stage</text>
    <text x="530" y="428" text-anchor="middle" fill="#d6dde3" font-size="11">opaque · slot = ASIC_ID</text>
    <line x1="630" y1="413" x2="660" y2="413" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="660" y="388" width="160" height="50" rx="6" fill="#1e2a3a" stroke="#60a5fa" stroke-width="1.3"/>
    <text x="740" y="418" text-anchor="middle" fill="#60a5fa">host</text>
  </g>
  <text x="490" y="460" text-anchor="middle" fill="#556069" font-family="Ubuntu,sans-serif" font-size="10">UART § Result Aggregation Model · scan ~300 µs · aggregate before TDM stream</text>

  <!-- Four labeled gaps -->
  <text x="490" y="492" text-anchor="middle" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="9" letter-spacing="0.1em">FOUR LABELED GAPS (NOT FILLED)</text>
  <g font-family="Ubuntu,sans-serif" font-size="11">
    <rect x="40" y="508" width="440" height="70" rx="6" fill="#2a1818" stroke="#E86A2B" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="56" y="530" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="9">GAP 1 · INTRA-SLOT EMISSION ORDER</text>
    <text x="56" y="550" fill="#d6dde3">When more than one class is pending — no public source;</text>
    <text x="56" y="566" fill="#7a8792">parsers are order-agnostic by construction.</text>

    <rect x="500" y="508" width="440" height="70" rx="6" fill="#2a1818" stroke="#E86A2B" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="516" y="530" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="9">GAP 2 · NOOP PAYLOAD</text>
    <text x="516" y="550" fill="#d6dde3">Show by length only on this figure (class 0x0f).</text>
    <text x="516" y="566" fill="#7a8792">ASCII reply documented separately as 2ZB (#9).</text>

    <rect x="40" y="590" width="440" height="70" rx="6" fill="#2a1818" stroke="#E86A2B" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="56" y="612" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="9">GAP 3 · DELAY-REGISTER TIMING PICTURE</text>
    <text x="56" y="632" fill="#d6dde3">TDM_DELAY 0x09 exists; waveform / bit-time placement</text>
    <text x="56" y="648" fill="#7a8792">inside the slot is not drawn.</text>

    <rect x="500" y="590" width="440" height="70" rx="6" fill="#2a1818" stroke="#E86A2B" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="516" y="612" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="9">GAP 4 · 0x0A × TDM INTERACTION</text>
    <text x="516" y="632" fill="#d6dde3">Class enables are orthogonal to TDM enable;</text>
    <text x="516" y="648" fill="#7a8792">combined timing interaction not drawn.</text>
  </g>

  <text x="490" y="690" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">Anti-notes: slot interior not exploded · do not derive occupancy from 10×11=110 vs 100-bit-period (those do not reconcile).</text>
  <text x="490" y="720" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">Caption: UART § TDM Overview / Result Aggregation / TX ctrl 0x0A + public OSS control packing. Original diagram from public references. Issue #13.</text>
  <text x="490" y="740" text-anchor="middle" fill="#556069" font-family="Ubuntu,sans-serif" font-size="9">Character-frame SVG remains drawings/uart/uart-9bit-character-frame.svg</text>
</svg>
