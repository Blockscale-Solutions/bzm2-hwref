  <rect x="20" y="20" width="860" height="660" rx="10" fill="#1a2228" stroke="#3a4650" stroke-width="1.5"/>
  <text x="450.0" y="50" text-anchor="middle" fill="#7a8792" font-family="Orbitron,sans-serif" font-size="11" font-weight="600" letter-spacing="0.1em">RDS · PRIMARY EXAMPLE · HASHBOARD STACK WIRING</text>
  <text x="450.0" y="70" text-anchor="middle" fill="#2dd4bf" font-family="Ubuntu,sans-serif" font-size="11">Structure only · 3 boards on one shared rail · 100 ASICs per board shown by the vendor as 25 stacks × 4</text>
  <text x="240" y="100" text-anchor="middle" fill="#2dd4bf" font-family="Orbitron,sans-serif" font-size="10" font-weight="600" letter-spacing="0.1em">25S4P · SETTLED BY ANALYSIS</text>
  <text x="240" y="116" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">physical confirmation: unpowered continuity check</text>
  <text x="660" y="100" text-anchor="middle" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="10" font-weight="600" letter-spacing="0.1em">RULED OUT · 25 × (2S2P)</text>
  <text x="660" y="116" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">shown for comparison only</text>
