<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="RDS stack wiring readings: 25 levels of 4 in parallel versus 2s2p">
  <title>RDS hashboard stack wiring: leading 25s4p reading vs superseded 2s2p</title>
  <desc>Structure-only diagram of the two readings of how the 4 ASICs in each of 25 stacks are wired on an RDS hashboard. Leading: 25 levels of 4 in parallel. Superseded: 2 in series by 2 in parallel per stack. Both unconfirmed until a per-level check on hardware. No RDS measurements; arithmetic on the published nominal per-ASIC voltage.</desc>
