<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1180" role="img"
     aria-label="BZM2 power-up and bring-up flowchart from Integration Guide and Board Design Guide">
  <title>BZM2 power-up / bring-up sequence</title>
  <desc>Original flowchart derived from Integration Guide Power-Up And Bring-Up Sequence Mermaid and Board Design Guide §7 fail-safes. Not a lab measurement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="760" height="1180" fill="#12171c"/>
  <rect x="20" y="20" width="720" height="1140" rx="10" fill="#1a2228" stroke="#3a4650" stroke-width="1.5"/>
  <text x="380" y="52" text-anchor="middle" fill="#7a8792" font-family="Orbitron,sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em">BZM2 · POWER-UP / BRING-UP SEQUENCE</text>
  <text x="380" y="72" text-anchor="middle" fill="#2dd4bf" font-family="Ubuntu,sans-serif" font-size="11">Integration Guide Mermaid + Board §7 fail-safes · original diagram from public references</text>

  <!-- Parallel fail-safes panel -->
  <rect x="40" y="92" width="680" height="78" rx="6" fill="#151a1f" stroke="#E86A2B" stroke-width="1.2"/>
  <text x="56" y="114" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="9" letter-spacing="0.1em">HARDWARE FAIL-SAFES (Board §7 / §9) — parallel gates</text>
  <text x="56" y="136" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="12">Reset pull-down default (NRST asserted) · core-buck enable off at power-up · TRIP gates VCORE enable in hardware</text>
  <text x="56" y="156" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">Control/IO rails before hash-stack voltage · firmware releases reset deliberately</text>

  <!-- Flow boxes -->
  <g font-family="Ubuntu,sans-serif" font-size="13">
    <!-- helper: each step y += 58 -->
    <rect x="180" y="190" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="215" text-anchor="middle" fill="#d6dde3">1 · Apply control rails and reference clock</text>

    <line x1="380" y1="230" x2="380" y2="250" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="250" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="275" text-anchor="middle" fill="#d6dde3">2 · Apply safe initial stack voltage</text>

    <line x1="380" y1="290" x2="380" y2="310" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="310" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="335" text-anchor="middle" fill="#d6dde3">3 · Hold ASICs in reset</text>

    <line x1="380" y1="350" x2="380" y2="370" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="370" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="395" text-anchor="middle" fill="#d6dde3">4 · Bring UART online at 5 Mbps</text>

    <line x1="380" y1="410" x2="380" y2="430" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="430" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="455" text-anchor="middle" fill="#d6dde3">5 · Enumerate ASICs from default ID <tspan font-family="JetBrains Mono,monospace" fill="#2dd4bf">0xFA</tspan></text>

    <line x1="380" y1="470" x2="380" y2="490" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Decision: NOOP -->
    <path d="M380 490 L520 520 L380 550 L240 520 Z" fill="#252018" stroke="#E86A2B" stroke-width="1.4"/>
    <text x="380" y="516" text-anchor="middle" fill="#d6dde3" font-size="12">6 · Confirm NOOP reply</text>
    <text x="380" y="534" text-anchor="middle" fill="#E86A2B" font-size="11" font-family="JetBrains Mono,monospace">NOOP reply (see #9)</text>

    <!-- fail branch -->
    <line x1="520" y1="520" x2="620" y2="520" stroke="#E86A2B" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="580" y="490" width="140" height="60" rx="6" fill="#2a1818" stroke="#E86A2B" stroke-width="1.3"/>
    <text x="650" y="514" text-anchor="middle" fill="#E86A2B" font-size="11" font-weight="600">STOP</text>
    <text x="650" y="532" text-anchor="middle" fill="#d6dde3" font-size="10">do not proceed</text>

    <line x1="380" y1="550" x2="380" y2="570" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="570" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="595" text-anchor="middle" fill="#d6dde3">7 · Initialize LDO-related state and ASIC IDs</text>

    <line x1="380" y1="610" x2="380" y2="630" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="630" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="655" text-anchor="middle" fill="#d6dde3">8 · Program safe initial PLL frequency</text>

    <line x1="380" y1="670" x2="380" y2="690" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <path d="M380 690 L520 720 L380 750 L240 720 Z" fill="#252018" stroke="#E86A2B" stroke-width="1.4"/>
    <text x="380" y="716" text-anchor="middle" fill="#d6dde3" font-size="12">9 · Wait for PLL lock</text>
    <text x="380" y="734" text-anchor="middle" fill="#7a8792" font-size="10">unlock → stop</text>

    <line x1="520" y1="720" x2="620" y2="720" stroke="#E86A2B" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="580" y="690" width="140" height="60" rx="6" fill="#2a1818" stroke="#E86A2B" stroke-width="1.3"/>
    <text x="650" y="714" text-anchor="middle" fill="#E86A2B" font-size="11" font-weight="600">STOP</text>
    <text x="650" y="732" text-anchor="middle" fill="#d6dde3" font-size="10">PLL unlock</text>

    <line x1="380" y1="750" x2="380" y2="770" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="770" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="795" text-anchor="middle" fill="#d6dde3">10 · Enable TDM if streaming is needed</text>

    <line x1="380" y1="810" x2="380" y2="830" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="830" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="855" text-anchor="middle" fill="#d6dde3">11 · Submit dummy work to keep engines loaded</text>

    <line x1="380" y1="870" x2="380" y2="890" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="890" width="400" height="48" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="910" text-anchor="middle" fill="#d6dde3">12 · Raise stack voltage gradually while monitoring VS</text>
    <text x="380" y="926" text-anchor="middle" fill="#7a8792" font-size="10">no sensor feedback → do not ramp (Practical bring-up rules)</text>

    <line x1="380" y1="938" x2="380" y2="958" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="958" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="983" text-anchor="middle" fill="#d6dde3">13 · Run tuning and calibration sweep</text>

    <line x1="380" y1="998" x2="380" y2="1018" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="1018" width="400" height="40" rx="6" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="380" y="1043" text-anchor="middle" fill="#d6dde3">14 · Transition to production job dispatch</text>
  </g>

  <!-- Trip note -->
  <rect x="40" y="1078" width="680" height="36" rx="4" fill="#151a1f" stroke="#3a4650" stroke-width="1"/>
  <text x="380" y="1100" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">Any time: TRIP / stack imbalance → treat as shutdown-class (Integration Guide trip + Board §9)</text>

  <text x="380" y="1140" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">Caption: derived from published reference sequence (Integration Guide § Power-Up And Bring-Up Sequence; Board Design Guide §7); not a lab measurement. Original diagram from public references.</text>
</svg>
