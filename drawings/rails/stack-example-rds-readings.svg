  <rect x="244.0" y="315" width="52" height="32" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/><text x="270.0" y="329" text-anchor="middle" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="10">ASIC</text><text x="270.0" y="341" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="8">≈0.71 V</text>
  <rect x="304.0" y="315" width="52" height="32" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/><text x="330.0" y="329" text-anchor="middle" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="10">ASIC</text><text x="330.0" y="341" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="8">≈0.71 V</text>
  <line x1="240" y1="354" x2="240" y2="362" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="180" y="362" width="120" height="20" rx="3" fill="#2a2f35" stroke="#556069" stroke-width="1.1"/><text x="240.0" y="376" text-anchor="middle" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="10">board return</text>
  <text x="240" y="406" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">25 ASIC levels = 50 voltage domains in series</text>
  <text x="240" y="422" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">level ≈ rail / 25 (uneven) · ≈ 17.75 V at 0.71 V nominal (arithmetic)</text>
  <text x="240" y="438" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">one level = one ASIC's span (ch0 + ch1 + midpoint); 4 share its current</text>
  <text x="240" y="454" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">rail is a commanded setpoint; no per-board voltage trim</text>
  <rect x="550" y="132" width="220" height="24" rx="3" fill="#252018" stroke="#E86A2B" stroke-width="1.2" stroke-dasharray="6 4"/><text x="660" y="148" text-anchor="middle" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="11">one "stack" of 4</text>
  <line x1="660" y1="156" x2="660" y2="164" stroke="#E86A2B" stroke-width="2"/>
  <rect x="594" y="164" width="132" height="46" rx="5" fill="#151a1f" stroke="#3a4650" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="604" y="171" width="52" height="32" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/><text x="630" y="185" text-anchor="middle" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="10">ASIC</text><text x="630" y="197" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="8">≈0.71 V</text>
  <rect x="664" y="171" width="52" height="32" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/><text x="690" y="185" text-anchor="middle" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="10">ASIC</text><text x="690" y="197" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="8">≈0.71 V</text>
