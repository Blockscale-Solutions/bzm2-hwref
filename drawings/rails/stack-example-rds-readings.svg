<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="RDS stack wiring: 25 levels of 4 in parallel; 2s2p ruled out">
  <title>RDS hashboard stack wiring: 25s4p settled by analysis; 2s2p ruled out</title>
  <desc>Structure-only diagram of the two readings of how the 4 ASICs in each of 25 stacks are wired on an RDS hashboard. 25 ASIC levels of 4 in parallel (50 voltage domains), settled by analysis; physical confirmation is an unpowered continuity check. 2s2p (2 in series by 2 in parallel per stack) is ruled out: it would put each ASIC near 0.35 V, below its operating window. No RDS measurements; arithmetic on the published nominal per-ASIC voltage.</desc>
