  <text x="660" y="388" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">Fits only if ~355 mV were a whole ASIC.</text>
  <text x="660" y="404" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">Per the sensor-channel table, ~355 mV is one</text>
  <text x="660" y="420" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">internal stack (ch0 or ch1): half an ASIC.</text>
