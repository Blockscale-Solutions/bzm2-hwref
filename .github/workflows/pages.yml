name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Keep a single source of truth at repo-root references/; copy into the
      # Pages artifact so the client-side renderer can fetch same-origin.
      - name: Stage references into site/
        run: |
          rm -rf site/references
          mkdir -p site/references
          cp -a references/. site/references/
          # Do not publish local working notes even if present on a runner checkout
          rm -f site/references/bzm2-porting-conversation-log.md
          ls -la site/references
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
