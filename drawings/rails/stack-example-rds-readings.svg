  <text x="240" y="406" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">25 levels × 0.71 V ≈ 17.75 V nominal (arithmetic)</text>
  <text x="240" y="422" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">one level = one ASIC's span; 4 share its current</text>
