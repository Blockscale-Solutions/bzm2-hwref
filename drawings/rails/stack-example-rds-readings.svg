  <text x="660" y="498" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="10">25s4p: short: level of 4 lost, others +4.2 % · open: partners +33 %</text>
  <text x="660" y="514" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="10">2s2p: short: others +2 % · open: partner ≈ 2×</text>
  <text x="450.0" y="664" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">Caption: structure only; no RDS measurements. Voltages are arithmetic on the Integration Guide's nominal 0.71 V per ASIC. See the Voltage-Stack Examples page and issue #31.</text>
