  <rect x="594" y="218" width="132" height="46" rx="5" fill="#151a1f" stroke="#3a4650" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="604" y="225" width="52" height="32" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/><text x="630" y="239" text-anchor="middle" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="10">ASIC</text><text x="630" y="251" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="8">≈0.71 V</text>
  <rect x="664" y="225" width="52" height="32" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/><text x="690" y="239" text-anchor="middle" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="10">ASIC</text><text x="690" y="251" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="8">≈0.71 V</text>
  <line x1="660" y1="264" x2="660" y2="272" stroke="#E86A2B" stroke-width="2"/>
  <text x="660" y="292" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">2 in series × 2 in parallel per stack</text>
  <text x="660" y="310" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">25 stacks = 50 levels × 0.71 V ≈ 35.5 V nominal</text>
  <text x="660" y="326" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">(arithmetic): twice the 25s4p rail</text>
  <rect x="470" y="348" width="380" height="92" rx="6" fill="#252018" stroke="#E86A2B" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="660" y="368" text-anchor="middle" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="9" font-weight="600" letter-spacing="0.1em">WHY RULED OUT</text>
  <text x="660" y="388" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">50 ASICs in series on the same rail puts each near 0.35 V:</text>
  <text x="660" y="404" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">half nominal, below the ~0.6 V operating floor. The boards hash.</text>
  <text x="660" y="420" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="11">~355 mV is one internal domain (ch0 or ch1), not a whole ASIC.</text>
  <rect x="470" y="458" width="380" height="86" rx="6" fill="#151a1f" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="660" y="478" text-anchor="middle" fill="#2dd4bf" font-family="Orbitron,sans-serif" font-size="9" font-weight="600" letter-spacing="0.1em">25S4P FAULT REASONING (INFERRED)</text>
  <text x="660" y="498" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="10">short: failed ASIC carries ≈ the string current; 3 partners ≈ 0</text>
  <text x="660" y="514" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="10">others +4.2 % on average, worst level more (levels uneven)</text>
  <text x="660" y="530" text-anchor="middle" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="10">open: 3 partners carry the level, ≈ +33 % each</text>
  <text x="450.0" y="664" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">Caption: structure and reasoning only; no RDS measurements. Voltages are arithmetic on the Integration Guide's nominal 0.71 V per ASIC. Issue #31.</text>
</svg>
