  <text x="240" y="290" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="12">… levels L23 to L2 …</text>
  <line x1="240" y1="300" x2="240" y2="308" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="114.0" y="308" width="252" height="46" rx="5" fill="#151a1f" stroke="#3a4650" stroke-width="1"/>
  <text x="108.0" y="336" text-anchor="end" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">L1</text>
  <rect x="124.0" y="315" width="52" height="32" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/><text x="150.0" y="329" text-anchor="middle" fill="#d6dde3" font-family="JetBrains Mono,monospace" font-size="10">ASIC</text><text x="150.0" y="341" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="8">≈0.71 V</text>
