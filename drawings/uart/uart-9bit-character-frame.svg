<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img"
     aria-label="BZM2 UART 9-bit multidrop character frame from Physical Layer reference">
  <title>BZM2 UART 9-bit character frame</title>
  <desc>Original diagram of one UART character: start, D0–D7, 9th address flag, stop — from blockscale-uart-protocol-reference.md Physical Layer. Original diagram from public references.</desc>
  <rect width="920" height="420" fill="#12171c"/>
  <rect x="20" y="20" width="880" height="380" rx="10" fill="#1a2228" stroke="#3a4650" stroke-width="1.5"/>
  <text x="460" y="50" text-anchor="middle" fill="#7a8792" font-family="Orbitron,sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em">BZM2 UART · FIXED 9-BIT MULTIDROP CHARACTER</text>
  <text x="460" y="70" text-anchor="middle" fill="#2dd4bf" font-family="Ubuntu,sans-serif" font-size="11">Physical Layer And Link Characteristics · UART protocol reference</text>

  <!-- Idle line -->
  <text x="56" y="110" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">line idle (high)</text>
  <line x1="56" y1="130" x2="120" y2="130" stroke="#556069" stroke-width="2"/>

  <!-- Bit cells: start, D0..D7, 9th, stop = 11 cells -->
  <!-- x start at 130, each cell 60 wide -->
  <g font-family="JetBrains Mono,monospace" font-size="12">
    <!-- START -->
    <rect x="130" y="100" width="60" height="80" rx="3" fill="#2a1818" stroke="#E86A2B" stroke-width="1.4"/>
    <text x="160" y="128" text-anchor="middle" fill="#E86A2B" font-size="11" font-weight="600">START</text>
    <text x="160" y="148" text-anchor="middle" fill="#d6dde3" font-size="10">low</text>
    <text x="160" y="168" text-anchor="middle" fill="#7a8792" font-size="9">1 bit</text>

    <!-- D0-D7 -->
    <!-- D0 LSB first is typical UART; ref says "8 data bits" + 9th between MSB and stop -->
    <rect x="190" y="100" width="60" height="80" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="220" y="132" text-anchor="middle" fill="#2dd4bf" font-weight="600">D0</text>
    <text x="220" y="152" text-anchor="middle" fill="#7a8792" font-size="9">LSB</text>

    <rect x="250" y="100" width="60" height="80" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="280" y="138" text-anchor="middle" fill="#d6dde3" font-weight="600">D1</text>

    <rect x="310" y="100" width="60" height="80" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="340" y="138" text-anchor="middle" fill="#d6dde3" font-weight="600">D2</text>

    <rect x="370" y="100" width="60" height="80" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="400" y="138" text-anchor="middle" fill="#d6dde3" font-weight="600">D3</text>

    <rect x="430" y="100" width="60" height="80" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="460" y="138" text-anchor="middle" fill="#d6dde3" font-weight="600">D4</text>

    <rect x="490" y="100" width="60" height="80" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="520" y="138" text-anchor="middle" fill="#d6dde3" font-weight="600">D5</text>

    <rect x="550" y="100" width="60" height="80" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="580" y="138" text-anchor="middle" fill="#d6dde3" font-weight="600">D6</text>

    <rect x="610" y="100" width="60" height="80" rx="3" fill="#1a3a36" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="640" y="132" text-anchor="middle" fill="#2dd4bf" font-weight="600">D7</text>
    <text x="640" y="152" text-anchor="middle" fill="#7a8792" font-size="9">MSB</text>

    <!-- 9th address flag -->
    <rect x="670" y="100" width="80" height="80" rx="3" fill="#252018" stroke="#E86A2B" stroke-width="1.5"/>
    <text x="710" y="128" text-anchor="middle" fill="#E86A2B" font-size="11" font-weight="600">9th</text>
    <text x="710" y="148" text-anchor="middle" fill="#d6dde3" font-size="10">addr flag</text>
    <text x="710" y="168" text-anchor="middle" fill="#7a8792" font-size="9">not parity</text>

    <!-- STOP -->
    <rect x="750" y="100" width="60" height="80" rx="3" fill="#1e2a3a" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="780" y="128" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">STOP</text>
    <text x="780" y="148" text-anchor="middle" fill="#d6dde3" font-size="10">high</text>
    <text x="780" y="168" text-anchor="middle" fill="#7a8792" font-size="9">1 bit</text>
  </g>

  <!-- Bracket under data -->
  <line x1="190" y1="196" x2="670" y2="196" stroke="#3a4650" stroke-width="1.2"/>
  <text x="430" y="214" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">8 data bits · 9th bit sits between data MSB and stop bit</text>

  <!-- Meaning boxes -->
  <rect x="56" y="240" width="390" height="100" rx="6" fill="#151a1f" stroke="#E86A2B" stroke-width="1.2"/>
  <text x="72" y="266" fill="#E86A2B" font-family="Orbitron,sans-serif" font-size="9" letter-spacing="0.08em">9th BIT = 1 · ADDRESS</text>
  <text x="72" y="290" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="12">Byte is an address byte — start of a new command.</text>
  <text x="72" y="310" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="12">Every ASIC compares the low 8 bits against its <tspan font-family="JetBrains Mono,monospace" fill="#2dd4bf">ASIC_ID</tspan>.</text>
  <text x="72" y="330" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">Non-match ignores the rest until next 9th=1.</text>

  <rect x="474" y="240" width="390" height="100" rx="6" fill="#151a1f" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="490" y="266" fill="#2dd4bf" font-family="Orbitron,sans-serif" font-size="9" letter-spacing="0.08em">9th BIT = 0 · DATA</text>
  <text x="490" y="290" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="12">Byte is data belonging to the command in flight.</text>
  <text x="490" y="310" fill="#d6dde3" font-family="Ubuntu,sans-serif" font-size="12">Fixed 9-bit mode — not configurable to 8-bit.</text>
  <text x="490" y="330" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="11">IO: 1.2 V · bring-up convention 5 Mbps (2.5–10 Mbps).</text>

  <text x="460" y="380" text-anchor="middle" fill="#7a8792" font-family="Ubuntu,sans-serif" font-size="10">Caption: bit fields from UART protocol reference § Physical Layer And Link Characteristics (Fixed 9-bit multidrop framing). Original diagram from public references. Companion: tdm-frame-and-result-path.svg (opaque slot; #13).</text>
</svg>
